name: Release

# main'e changeset'li bir PR birleşince changesets/action bir "Version Packages"
# PR'ı açar (sürüm + CHANGELOG). O PR merge edilince paketler npm'e yayınlanır.
# Yayınlanacak sürüm yoksa (ilk sürüm 0.1.0 dahil) `changeset publish`
# npm'de olmayan sürümleri doğrudan yayınlar.

on:
  push:
    branches: [main]
  # Elle çalıştırma (Actions → Release → Run workflow): ayarlar sonradan
  # tamamlandığında, token yenilendiğinde ya da yarım kalan yayını yeniden denemek için.
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm provenance (paketin bu iş akışından derlendiğinin imzası) — repo public olmalı.
  id-token: write

jobs:
  release:
    name: Version PR / npm yayını
    # NPM_TOKEN secret'ı eklenip repo değişkeni RELEASE_ENABLED=true yapılana
    # kadar çalışmaz (yoksa her main push'unda yayın denenip düşerdi).
    if: vars.RELEASE_ENABLED == 'true'
    # ubuntu-latest 2026-10-19'dan itibaren Ubuntu 26'ya geçiyor; Playwright'ın sistem
    # bağımlılıkları (story testleri) yeni sürümde doğrulanana kadar sabit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # CI ile aynı LTS (bkz. ci.yml).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version PR ya da yayın
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: "chore: sürüm paketleri"
          commit-message: "chore: sürüm paketleri"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
