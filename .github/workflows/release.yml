name: Release

# main'e changeset'li bir PR birleşince changesets/action bir "Version Packages"
# PR'ı açar (sürüm + CHANGELOG). O PR merge edilince paketler npm'e yayınlanır.
# Yayınlanacak sürüm yoksa (ilk sürüm 0.1.0 dahil) `changeset publish`
# npm'de olmayan sürümleri doğrudan yayınlar.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm provenance (paketin bu iş akışından derlendiğinin imzası) — repo public olmalı.
  id-token: write

jobs:
  release:
    name: Version PR / npm yayını
    # NPM_TOKEN secret'ı eklenip repo değişkeni RELEASE_ENABLED=true yapılana
    # kadar çalışmaz (yoksa her main push'unda yayın denenip düşerdi).
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # CI ile aynı LTS (bkz. ci.yml).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version PR ya da yayın
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "chore: sürüm paketleri"
          commit: "chore: sürüm paketleri"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
