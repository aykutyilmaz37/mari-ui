name: CI

# Faz 8 (backlog madde 13+16) öncesinde bu repo'da HİÇ CI yoktu — `pnpm turbo
# run build lint typecheck test` ve `pnpm audit` sadece elle çalıştırılıyordu.
# Bu iş akışı olmadan eslint-plugin-sonarjs (kod kalitesi) ve dependency
# override'ların (güvenlik yaması) gerçek değeri yoktu — birileri unutup elle
# çalıştırmazsa hiçbir şey onları zorlamıyordu.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-typecheck-test:
    name: Build, lint, typecheck, test
    # ubuntu-latest 2026-10-19'dan itibaren Ubuntu 26'ya geçiyor; Playwright'ın sistem
    # bağımlılıkları (story testleri) yeni sürümde doğrulanana kadar sabit.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # LTS'e sabitlendi: bu monorepo'nun geliştirme ortamında Node 25 (LTS
      # olmayan bir sürüm), tsup'ın dts-build worker'ının varsayılan V8 heap
      # limitini bu iş yükü için yetersiz bırakıyordu (bkz. packages/
      # components/tsup.config.ts'teki not, Faz 5). CI'ın bu sürprizi
      # TEKRARLAMAMASI için bilinen-iyi bir LTS kullanılıyor.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, lint, typecheck (tüm workspace paketleri)
        run: pnpm turbo run build lint typecheck

      # Bundle boyutu kilidi + sızıntı testi (bundle performansı Faz 1): her web
      # ve native subpath entry'si + native kök barrel'ı min+gz ölçülür, size-limits.json
      # aşılırsa ya da bir entry kaynakta import etmediği bileşenin kodunu
      # çekerse kırılır. Bilinçli büyüme: `pnpm size:update`.
      - name: Bundle boyutu + sızıntı testi
        run: pnpm size

      # Testler coverage ile ve paketler SIRAYLA koşar (her paketin vitest'i
      # kendi içinde paralel): hepsi lint/typecheck ile aynı anda koşunca az
      # çekirdekli runner'da testler zaman aşımına düşüyordu. Eşik
      # (bugünkü oranın ~1 puan altı, vitest.config.ts) düşerse CI kırılır.
      - name: Test + coverage
        run: pnpm turbo run test:coverage --concurrency=1

      # Storybook bir önceki adımda statik derlendi (apps/docs build). Her story
      # (web + native) Playwright'ta açılır: çizim / `play` hatası ve axe ihlali testi
      # kırar — bkz. apps/docs/.storybook/test-runner.ts. Görsel fark (`VISUAL=1`)
      # bilerek kapalı: ekran görüntüsü referansları (apps/docs/__visual__) bakım
      # yükü getirdi (hover/saat/yükleme zamanlamasına bağlı kararsız story'ler).
      - name: Story testleri (çizim + etkileşim + axe)
        run: >-
          docker run --rm --ipc=host -v "$PWD":/w -w /w/apps/docs -e CI=true
          mcr.microsoft.com/playwright:v1.64.0-noble
          bash -c 'export PATH=/w/node_modules/.bin:$PATH && concurrently -k -s first -n SB,TEST
          "http-server storybook-static --port 6106 --silent"
          "wait-on tcp:127.0.0.1:6106 && test-storybook --url http://127.0.0.1:6106"'

      - name: Bağımlılık güvenlik taraması (kritik/yüksek eşiği)
        # `image-size` (react-native > metro, transitif, dev-only) için henüz
        # yayınlanmış bir yama yok — bkz. pnpm-workspace.yaml'daki overrides
        # notu. Bu yüzden eşik "critical"te tutulyor (bugün itibarıyla 0);
        # "high"a çekilirse bu bilinen/kabul edilmiş risk CI'ı kırar.
        run: pnpm audit --audit-level critical

      - name: Bağımlılık güvenlik taraması (tam rapor, bilgilendirme amaçlı)
        if: always()
        run: pnpm audit || true
